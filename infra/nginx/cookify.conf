# Nginx on the EC2 instance, behind CloudFront.
#   /           → frontend static files (/var/www/cookify)
#   /api, /ws   → Spring Boot on 127.0.0.1:8080 (WebSocket upgrade for chat)
#   /media      → served by CloudFront straight from S3 (never reaches this server)
# Install: sudo cp cookify.conf /etc/nginx/conf.d/cookify.conf && sudo nginx -t && sudo systemctl reload nginx

# CloudFront appends the viewer's IP as the LAST entry of X-Forwarded-For. Use only that entry,
# so clients can't spoof their IP (rate limiting relies on it) by sending their own header.
map $http_x_forwarded_for $cookify_client_ip {
    "~(?<last>[^,\s]+)\s*$" $last;
    default                 $remote_addr;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/cookify;
    index index.html;

    # Recipe videos can be up to 50 MB.
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $cookify_client_ip;
        proxy_set_header X-Forwarded-Proto https;   # visitors always use HTTPS via CloudFront
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $cookify_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;                      # keep chat connections open
    }

    # Media: with CloudFront, /media/* goes straight to S3 and never reaches this server. Without it
    # (MEDIA_VIA_APP=true), the app streams files from the private bucket.
    location ^~ /media/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host  $host;
        proxy_set_header Range $http_range;
        limit_except GET HEAD { deny all; }
    }

    # Static frontend: HTML always revalidated; CSS/JS/locale files cached briefly.
    location ~* \.(css|js|json|svg|png|jpg|webp|ico)$ {
        expires 1h;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
