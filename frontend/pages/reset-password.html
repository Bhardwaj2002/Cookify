<!DOCTYPE html>
<html lang="en" data-i18n-title="reset.pageTitle">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/icons/chef-hat.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages/auth.css">
  <title>Reset password · Cookify</title>
</head>
<body>
  <header id="site-header"></header>

  <main class="page-main page-main--center">
    <section class="card auth-card" data-panel="form">
      <div class="auth-card__header">
        <h1 data-i18n="reset.title"></h1>
        <p data-i18n="reset.subtitle"></p>
      </div>
      <form class="form" id="reset-form" novalidate>
        <div class="alert" data-form-alert hidden></div>
        <div class="field">
          <label class="field__label" for="password" data-i18n="reset.password"></label>
          <div class="password-wrap">
            <input class="input" id="password" name="password" type="password" autocomplete="new-password" required>
            <button type="button" class="password-toggle" data-i18n="common.show"></button>
          </div>
          <span class="field__error"></span>
        </div>
        <div class="field">
          <label class="field__label" for="confirmPassword" data-i18n="reset.confirmPassword"></label>
          <div class="password-wrap">
            <input class="input" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
            <button type="button" class="password-toggle" data-i18n="common.show"></button>
          </div>
          <span class="field__error"></span>
        </div>
        <ul class="rules" id="password-rules" aria-live="polite">
          <li data-rule="length" data-i18n="passwordRules.length"></li>
          <li data-rule="noSpaces" data-i18n="passwordRules.noSpaces"></li>
          <li data-rule="allowedChars" data-i18n="passwordRules.allowedChars"></li>
          <li data-rule="match" data-i18n="passwordRules.match"></li>
        </ul>
        <button class="btn btn--block btn--lg" type="submit" data-i18n="reset.submit"></button>
      </form>
    </section>

    <section class="card auth-card result-panel" data-panel="done" hidden>
      <div class="result-panel__icon" aria-hidden="true">✅</div>
      <h1 data-i18n="reset.doneTitle"></h1>
      <p data-i18n="reset.doneText"></p>
      <a class="btn" href="/pages/login.html" data-i18n="nav.login"></a>
    </section>

    <section class="card auth-card result-panel" data-panel="invalid" hidden>
      <div class="result-panel__icon" aria-hidden="true">🔗</div>
      <p data-invalid-message></p>
      <a class="btn" href="/pages/forgot-password.html" data-i18n="reset.requestNew"></a>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script type="module" src="/js/pages/reset-password.js"></script>
</body>
</html>
