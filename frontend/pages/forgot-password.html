<!DOCTYPE html>
<html lang="en" data-i18n-title="forgot.pageTitle">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/icons/chef-hat.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,600&family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages/auth.css">
  <title>Forgot password · Cookify</title>
</head>
<body>
  <header id="site-header"></header>

  <main class="page-main page-main--center">
    <section class="card auth-card" data-panel="form">
      <div class="auth-card__header">
        <h1 data-i18n="forgot.title"></h1>
        <p data-i18n="forgot.subtitle"></p>
      </div>
      <form class="form" id="forgot-form" novalidate>
        <div class="alert" data-form-alert hidden></div>
        <div class="field">
          <label class="field__label" for="identifier" data-i18n="login.identifier"></label>
          <input class="input" id="identifier" name="identifier" autocomplete="username" required
                 data-i18n-placeholder="login.identifierPlaceholder">
          <span class="field__error"></span>
        </div>
        <button class="btn btn--block btn--lg" type="submit" data-i18n="forgot.submit"></button>
      </form>
      <p class="auth-card__footer"><a href="/pages/login.html" data-i18n="common.backToLogin"></a></p>
    </section>

    <section class="card auth-card result-panel" data-panel="sent" hidden>
      <div class="result-panel__icon" aria-hidden="true">📬</div>
      <h1 data-i18n="forgot.sentTitle"></h1>
      <p data-i18n="forgot.sentText"></p>
      <p class="alert" data-dev-hint hidden data-i18n="forgot.devHint"></p>
      <a class="btn btn--ghost" href="/pages/login.html" data-i18n="common.backToLogin"></a>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script type="module" src="/js/pages/forgot-password.js"></script>
</body>
</html>
