# Local development: local Postgres, local file storage, emails printed to console.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cookify
    username: ${DB_USERNAME:${USER}}
    password: ${DB_PASSWORD:}
  jpa:
    show-sql: false

logging:
  level:
    com.cookify: DEBUG

app:
  url: http://localhost:8080
  frontend-url: http://localhost:5500 # VS Code Live Server
  demo-data:
    enabled: true # sample cooks + recipes (password Cookify2026!)
  rate-limit:
    enabled: false # on in production; off locally so repeated manual testing isn't throttled
  jwt:
    # Dev-only key. Production reads JWT_SECRET from the environment.
    secret: ZGV2LW9ubHktY29va2lmeS1qd3Qtc2VjcmV0LWNoYW5nZS1tZQ==
  auth:
    cookie:
      secure: false # plain http://localhost
  cors:
    allowed-origins:
      - http://localhost:5500
      - http://127.0.0.1:5500
